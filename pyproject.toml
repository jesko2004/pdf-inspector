[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pdf-inspector"
version = "0.2.6"
description = "Fast PDF inspection, classification, and text extraction with smart scanned vs text-based detection"
readme = "docs/python.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]
[project.urls]
Homepage = "https://github.com/jesko2004/pdf-inspector"
Repository = "https://github.com/jesko2004/pdf-inspector"
Documentation = "https://github.com/jesko2004/pdf-inspector/blob/main/docs/python.md"

[project.optional-dependencies]
backend = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
ocr = [
    "PyMuPDF>=1.24,<2",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.18,<2",
]
pgvector = [
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
]
test = [
    "httpx2>=2,<3",
]

[project.scripts]
pdf-inspector-api = "backend.server:run"
pdf-inspector-backup = "backend.backup:main"

[tool.maturin]
features = ["python"]
python-packages = ["backend"]
